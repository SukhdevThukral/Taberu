<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Taberu - Recipe</title>
        <link rel="icon" href="assets/logo.png">
        <link rel="stylesheet" href="styles.css"/>
    </head>

    <body class="page">

        <nav class="navbar">
            <img src="assets/logo.png" alt="taberuLogo" class="TaberuLogo">
            <div class="navItems">
                <a href="index.html">home</a>
                <a  href="dishes.html">dishes</a>
                <a href="recipes.html">recipes</a>
            </div>
        </nav>

        <section id="recipeOutput" class="recipeOutput">
            <p class="loadingMsg">generating your recipe... :b</p>
        </section>

        <footer class="landingFooter">
            <p>taberu - to eat :3</p>
        </footer>

        <div id="keyModal" class="keyModal">
            <div class="keyModalBox">
                <h2>hey! :0</h2>
                <p>taberu needs to eat an anthropic key to generate sum cool recipes, it stays in your browser only tho :3.</p>
                <a href="https://console.anthropic.com/keys" target="_blank" class="getKeyBtn">get a key here :D</a>
                <input id="keyInput" type="password" placeholder="sk-ant-...." class="keyInput"/>
                <button id="keySaveBtn" class="enterBtn">save & continue</button>
                <p class="keyNote">p.s.: stored in localStorage, only used to call anthropic directly</p>
            </div>
        </div>

        <script src="recipe.js"></script>
    </body>
